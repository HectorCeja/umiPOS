name: Flutter POS native readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/nexo_pos/**'
      - 'packages/nexo_flutter_design/**'
      - '.github/workflows/flutter-native.yml'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - name: Install Linux secure-storage build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0
      - run: flutter pub get
        working-directory: apps/nexo_pos
      - run: flutter analyze
        working-directory: apps/nexo_pos
      - run: flutter test --concurrency=1
        working-directory: apps/nexo_pos
      - run: flutter build ${{ matrix.target }} --release
        working-directory: apps/nexo_pos

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
        working-directory: apps/nexo_pos
      - run: flutter build apk --release
        working-directory: apps/nexo_pos

name: nexo_flutter_design
description: Canonical Flutter visual foundation generated from NEXO Design Language V1.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/artwork/womanpos.png
    - assets/artwork/products.jpeg
    - assets/artwork/inventory.jpeg
    - assets/artwork/analytics.jpeg
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrument-sans/InstrumentSans-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf

name: nexo_pos
description: Operational NEXO POS client. Flutter Web is test-harness only.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
hooks:
  user_defines:
    sqlite3:
      source: system
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: 3.0.6
  http: 1.5.0
  intl: 0.20.2
  flutter_secure_storage: 10.0.0
  path_provider: 2.1.5
  sqlite3: 3.1.1
  nexo_flutter_design:
    path: ../../packages/nexo_flutter_design
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
